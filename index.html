<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vwins - Color Trading App</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 0; }
    .header { background: #1e293b; padding: 15px; text-align: center; font-weight: bold; font-size: 20px; color: #38bdf8; }
    .card { background: #1e293b; margin: 15px; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .wallet-box { font-size: 22px; font-weight: bold; color: #4ade80; margin-top: 5px; }
    .btn-deposit { background: #22c55e; color: #000; padding: 10px 20px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; float: right; margin-top: -35px; }
    .color-buttons { display: flex; justify-content: space-between; margin-top: 15px; }
    .btn-game { flex: 1; margin: 0 5px; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; color: #fff; cursor: pointer; }
    .btn-green { background: #22c55e; }
    .btn-violet { background: #a855f7; }
    .btn-red { background: #ef4444; }
    .grid-numbers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; }
    .num-btn { background: #334155; border: 1px solid #475569; color: #fff; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 16px; }
    
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
    .modal-content { background: #1e293b; padding: 20px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; }
    .grid-amounts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
    .amt-btn { background: #334155; border: 1px solid #38bdf8; color: #fff; padding: 8px; border-radius: 6px; font-weight: bold; }
    input[type=number] { width: 90%; padding: 10px; border-radius: 6px; border: none; font-size: 16px; text-align: center; margin-bottom: 10px; }
    .pay-btn { width: 100%; padding: 12px; background: #38bdf8; border: none; color: #000; font-weight: bold; border-radius: 8px; font-size: 16px; }
    #qrcode { display: flex; justify-content: center; background: #fff; padding: 10px; border-radius: 8px; margin-top: 15px; min-height: 150px; align-items: center; color: #000; }
    .close-btn { color: #ef4444; float: right; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div class="header">Vwins Tiranga Game</div>

<div class="card">
  <span>Available Balance</span>
  <button class="btn-deposit" onclick="openDeposit()">Deposit</button>
  <div class="wallet-box">₹<span id="userBalance">0.00</span></div>
</div>

<div class="card">
  <h3>Select Color</h3>
  <div class="color-buttons">
    <button class="btn-game btn-green">Join Green</button>
    <button class="btn-game btn-violet">Join Violet</button>
    <button class="btn-game btn-red">Join Red</button>
  </div>

  <h3 style="margin-top: 20px;">Select Number</h3>
  <div class="grid-numbers">
    <button class="num-btn">0</button>
    <button class="num-btn">1</button>
    <button class="num-btn">2</button>
    <button class="num-btn">3</button>
    <button class="num-btn">4</button>
    <button class="num-btn">5</button>
    <button class="num-btn">6</button>
    <button class="num-btn">7</button>
    <button class="num-btn">8</button>
    <button class="num-btn">9</button>
  </div>
</div>

<div class="modal" id="depositModal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeDeposit()">✕</span>
    <h3 style="color:#38bdf8; margin-top:0;">Deposit Money</h3>
    
    <div class="grid-amounts">
      <button class="amt-btn" onclick="setAmt(100)">₹100</button>
      <button class="amt-btn" onclick="setAmt(500)">₹500</button>
      <button class="amt-btn" onclick="setAmt(1000)">₹1000</button>
      <button class="amt-btn" onclick="setAmt(2000)">₹2000</button>
      <button class="amt-btn" onclick="setAmt(5000)">₹5000</button>
      <button class="amt-btn" onclick="setAmt(10000)">₹10000</button>
    </div>

    <input type="number" id="amtInput" value="500" placeholder="Enter amount">
    <button class="pay-btn" onclick="fetchQR()">Pay via UPI QR</button>

    <div id="qrcode">QR Scanner Yahan Aayega</div>
    <p id="upiInfo" style="font-size:12px; color:#aaa; margin-top:5px;"></p>
  </div>
</div>

<script>
  function openDeposit() { document.getElementById('depositModal').style.display = 'flex'; }
  function closeDeposit() { document.getElementById('depositModal').style.display = 'none'; }
  function setAmt(val) { document.getElementById('amtInput').value = val; }

  async function fetchQR() {
    const val = document.getElementById('amtInput').value;
    const qrDiv = document.getElementById('qrcode');
    const upiTxt = document.getElementById('upiInfo');

    if(!val || val < 100) {
      alert("Minimum deposit amount is ₹100");
      return;
    }

    qrDiv.innerHTML = "Scanner Loading...";
    
    try {
      const res = await fetch('https://vwins-backend-3.onrender.com/api/get-scanner', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount: parseFloat(val) })
      });

      const data = await res.json();

      if(data.success) {
        qrDiv.innerHTML = "";
        new QRCode(qrDiv, { text: data.upi_qr_payload, width: 180, height: 180 });
        upiTxt.innerText = "Pay to UPI ID: " + data.upi_id;
      } else {
        qrDiv.innerHTML = "Error loading QR.";
      }
    } catch(err) {
      qrDiv.innerHTML = "Server Busy, 5 sec baad fir try karein.";
    }
  }
</script>

</body>
</html>
