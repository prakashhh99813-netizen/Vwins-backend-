<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vwins Deposit</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
    .container { max-width: 400px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 12px; }
    h2 { color: #00e676; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
    .btn { background: #333; border: 1px solid #00e676; color: #fff; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn:active { background: #00e676; color: #000; }
    input { width: 90%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; font-size: 16px; text-align: center; }
    .pay-btn { width: 100%; padding: 12px; margin-top: 15px; background: #00e676; border: none; color: #000; font-weight: bold; font-size: 18px; border-radius: 8px; cursor: pointer; }
    #qrcode { margin-top: 20px; display: flex; justify-content: center; background: #fff; padding: 15px; border-radius: 8px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Vwins Wallet Deposit</h2>
  <p>Select or Enter Amount</p>

  <div class="grid">
    <button class="btn" onclick="setAmount(100)">₹100</button>
    <button class="btn" onclick="setAmount(200)">₹200</button>
    <button class="btn" onclick="setAmount(300)">₹300</button>
    <button class="btn" onclick="setAmount(500)">₹500</button>
    <button class="btn" onclick="setAmount(1000)">₹1000</button>
    <button class="btn" onclick="setAmount(1500)">₹1500</button>
    <button class="btn" onclick="setAmount(2000)">₹2000</button>
    <button class="btn" onclick="setAmount(3000)">₹3000</button>
    <button class="btn" onclick="setAmount(5000)">₹5000</button>
  </div>

  <input type="number" id="amountInput" placeholder="Enter custom amount" value="500">
  <button class="pay-btn" onclick="generateQR()">Generate UPI QR</button>

  <div id="qrcode"></div>
  <p id="upiText" style="margin-top: 10px; font-size: 12px; color: #aaa;"></p>
</div>

<script>
  function setAmount(val) {
    document.getElementById('amountInput').value = val;
  }

  async function generateQR() {
    const amount = document.getElementById('amountInput').value;
    if(!amount || amount <= 0) {
      alert("Please enter a valid amount");
      return;
    }

    document.getElementById('qrcode').innerHTML = "Generating...";

    try {
      const response = await fetch('https://vwins-backend-3.onrender.com/api/get-scanner', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount: parseFloat(amount) })
      });

      const data = await response.json();

      if(data.success) {
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
          text: data.upi_qr_payload,
          width: 200,
          height: 200
        });
        document.getElementById('upiText').innerText = "Pay to UPI ID: " + data.upi_id;
      } else {
        alert("Error generating QR code");
      }
    } catch (err) {
      alert("Server Error, please try again");
    }
  }
</script>

</body>
</html>
